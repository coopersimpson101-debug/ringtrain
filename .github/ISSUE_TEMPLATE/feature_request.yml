name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to train or run, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Note any impact on the wire format, the rendezvous protocol or the checkpoint layout.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
